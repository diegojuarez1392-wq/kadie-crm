<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Importar Excel · Kadie CRM</title><style>body{margin:0;font:14px Arial,sans-serif;background:#f4f5f7;color:#17191c}.wrap{max-width:760px;margin:40px auto;padding:0 18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:22px;margin-bottom:16px}.btn{border:0;background:#17191c;color:#fff;border-radius:9px;padding:11px 16px;cursor:pointer}.muted{color:#6b7280}.ok{background:#eaf8f1;border:1px solid #bfe6d1;padding:12px;border-radius:9px}.err{background:#fee2e2;border:1px solid #fecaca;padding:12px;border-radius:9px}input[type=file]{display:block;margin:14px 0;padding:12px;border:1px dashed #cbd5e1;border-radius:10px;width:100%;background:#fafafa}a{color:#111827}</style></head><body><div class="wrap"><p><a href="/">← Volver al CRM</a></p><div class="card"><h1>Importar Excel histórico</h1><p class="muted">Carga el archivo con las hojas <b>BBDD</b> y <b>PEDIDOS 1</b>. El sistema actualizará pedidos, clientes, historial financiero y gastos sin duplicar las filas ya importadas.</p><div id="status" class="muted">Revisando estado...</div></div><div class="card"><form id="form"><label><b>Archivo Excel</b></label><input id="file" name="file" type="file" accept=".xlsx,.xls" required><button class="btn" type="submit">Importar a la base de datos</button></form><div id="result" style="margin-top:14px"></div></div></div><script>async function load(){const r=await fetch('/api/import/status');const j=await r.json();document.getElementById('status').textContent=`Importados actualmente: ${j.orders||0} pedidos · ${j.customers||0} clientes · ${j.financeDays||0} días financieros`;}document.getElementById('form').onsubmit=async e=>{e.preventDefault();const f=document.getElementById('file').files[0];if(!f)return;const out=document.getElementById('result');out.className='';out.textContent='Importando... puede tardar unos segundos.';const fd=new FormData();fd.append('file',f);try{const r=await fetch('/api/import/excel',{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw new Error(j.error||'Error de importación');out.className='ok';out.textContent=`Listo: ${j.orders} pedidos, ${j.customers} clientes, ${j.financeDays} días financieros y ${j.expenses} gastos procesados.`;load();}catch(err){out.className='err';out.textContent=err.message;}};load();</script></body></html>
